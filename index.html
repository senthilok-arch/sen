<!DOCTYPE html>

<html>
<head>
  <title>Dog Race 🐶🏁</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
    }

    .controls {
      margin: 20px;
    }

    input {
      padding: 8px;
    }

    button {
      padding: 8px 12px;
      margin: 5px;
      cursor: pointer;
    }

    #track {
      width: 90%;
      margin: auto;
      margin-top: 30px;
      border: 3px solid #333;
      background: #ddd;
      padding: 10px;
    }

    .lane {
      position: relative;
      height: 50px;
      margin: 10px 0;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
    }

    .dog {
      position: absolute;
      top: 10px;
      left: 0;
      font-size: 24px;
      transition: transform 0.5s linear; /* 🎞️ smooth animation */
    }

    .finish {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: 5px;
      background: red;
    }
  </style>

</head>

<body>

<h1>🐶 Dog Race Track 🏁</h1>

<div class="controls">
  <input id="dogName" placeholder="Dog name">
  <button onclick="join()">Join</button>
  <button onclick="startRace()">Start Race</button>
</div>

<p id="status"></p>

<div id="track"></div>

<script>
const API = "https://senthil.onrender.com";
let interval;

// Safe fetch
async function safeFetch(url, options = {}) {
  try {
    const res = await fetch(url, options);
    const text = await res.text();
    console.log("RAW:", text);
    return JSON.parse(text);
  } catch (err) {
    document.getElementById("status").innerText = "❌ " + err.message;
    return null;
  }
}

async function join() {
  let name = document.getElementById("dogName").value.trim();

  if (!name) return alert("Enter dog name");

  let data = await safeFetch(`${API}/join/${name}`, { method: "POST" });

  if (data) {
    document.getElementById("status").innerText = data.message || data.error;
    render();
  }
}

async function startRace() {
  await safeFetch(`${API}/start`, { method: "POST" });

  interval = setInterval(async () => {
    let data = await safeFetch(`${API}/move`, { method: "POST" });

    if (data) {
      render();

      if (data.winner) {
        clearInterval(interval);
        alert("🏆 Winner: " + data.winner);
      }
    }
  }, 600); // speed of race
}

async function render() {
  let data = await safeFetch(`${API}/state`);
  if (!data) return;

  let track = document.getElementById("track");
  track.innerHTML = "";

  for (let dog in data.players) {
    let lane = document.createElement("div");
    lane.className = "lane";

    let dogDiv = document.createElement("div");
    dogDiv.className = "dog";
    dogDiv.innerText = dog + " 🐶";

    // 🚀 Smooth movement using transform
    dogDiv.style.transform = `translateX(${data.players[dog].position * 5}px)`;

    let finish = document.createElement("div");
    finish.className = "finish";

    lane.appendChild(dogDiv);
    lane.appendChild(finish);

    track.appendChild(lane);
  }
}
</script>

</body>
</html>
