<!DOCTYPE html>
<html>
<head>
  <title>🐶 Dog Race Arena</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      margin: 0;
      color: white;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
    }

    h1 {
      margin-top: 20px;
      font-size: 2.5rem;
    }

    .controls {
      margin: 20px auto;
      padding: 20px;
      width: 320px;
      border-radius: 15px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      width: 80%;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 15px;
      border-radius: 10px;
      border: none;
      margin: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.1);
    }

    .join-btn { background: #00c9a7; color: white; }
    .start-btn { background: #ff6b6b; color: white; }

    #status {
      font-size: 1.2rem;
      margin-top: 10px;
    }

    #track {
      width: 90%;
      margin: 30px auto;
    }

    .lane {
      position: relative;
      height: 70px;
      margin: 15px 0;
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      overflow: hidden;
    }

    .progress {
      position: absolute;
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #00f2fe, #4facfe);
      opacity: 0.25;
    }

    .dog {
      position: absolute;
      top: 10px;
      left: 0;
      transition: transform 0.4s ease-out;
      display: flex;
      align-items: center;
    }

    .dog img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 3px solid white;
      object-fit: cover;
    }

    .dog-name {
      margin-left: 8px;
      font-size: 14px;
    }

    .finish {
      position: absolute;
      right: 0;
      height: 100%;
      width: 8px;
      background: gold;
    }
  </style>
</head>

<body>

<h1>🏁 Dog Race Arena 🐶</h1>

<div class="controls">
  <input id="dogName" placeholder="Enter dog name 🐕">
  <br>
  <button class="join-btn" onclick="join()">Join</button>
  <button class="start-btn" onclick="startRace()">Start Race</button>

  <!-- ✅ Reset button -->
  <button onclick="resetGame()" style="background:#feca57;color:black;">
    Reset
  </button>
</div>

<p id="status"></p>

<div id="track"></div>

<script>
const API = "https://senthil.onrender.com";
let interval;

async function safeFetch(url, options = {}) {
  try {
    const res = await fetch(url, options);
    const text = await res.text();
    return JSON.parse(text);
  } catch (err) {
    document.getElementById("status").innerText = "❌ " + err.message;
    return null;
  }
}

async function join() {
  let name = document.getElementById("dogName").value.trim();
  if (!name) return alert("Enter dog name");

  let data = await safeFetch(`${API}/join/${name}`, { method: "POST" });

  if (data) {
    document.getElementById("status").innerText = data.message || data.error;
    render();
  }
}

async function startRace() {
  await safeFetch(`${API}/start`, { method: "POST" });

  interval = setInterval(async () => {
    let data = await safeFetch(`${API}/move`, { method: "POST" });

    if (data) {
      render();

      if (data.winner) {
        clearInterval(interval);
        document.getElementById("status").innerText = "🏆 Winner: " + data.winner;
      }
    }
  }, 500);
}

async function resetGame() {
  if (interval) {
    clearInterval(interval);
    interval = null;
  }

  await safeFetch(`${API}/reset`, { method: "POST" });

  document.getElementById("track").innerHTML = "";
  document.getElementById("status").innerText = "🔄 Game reset!";
  document.getElementById("dogName").value = "";
}

async function render() {
  let data = await safeFetch(`${API}/state`);
  if (!data) return;

  let track = document.getElementById("track");
  track.innerHTML = "";

  for (let dog in data.players) {
    let lane = document.createElement("div");
    lane.className = "lane";

    let progress = document.createElement("div");
    progress.className = "progress";
    progress.style.width = data.players[dog].position + "%";

    let dogDiv = document.createElement("div");
    dogDiv.className = "dog";

    let img = document.createElement("img");
    img.src = `https://placedog.net/200?id=${dog.length * 7}`;

    let name = document.createElement("div");
    name.className = "dog-name";
    name.innerText = dog;

    dogDiv.appendChild(img);
    dogDiv.appendChild(name);

    dogDiv.style.transform = `translateX(${data.players[dog].position * 6}px)`;

    let finish = document.createElement("div");
    finish.className = "finish";

    lane.appendChild(progress);
    lane.appendChild(dogDiv);
    lane.appendChild(finish);

    track.appendChild(lane);
  }
}
</script>

</body>
</html>
