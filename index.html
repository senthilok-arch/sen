<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dog Race Validation</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  margin-top: 50px;
  background: #111;
  color: white;
}

input {
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 10px 20px;
  margin-top: 10px;
  cursor: pointer;
}

#status {
  margin-top: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>🐶 Dog Race</h2>

<input id="dog1" placeholder="Enter Dog 1 Name">
<input id="dog2" placeholder="Enter Dog 2 Name">
<br>

<button onclick="startRace()">Start Race</button>

<p id="status"></p>

<script>
let gameStarted = false;

function startRace() {

  let dog1 = document.getElementById("dog1").value.trim();
  let dog2 = document.getElementById("dog2").value.trim();
  let status = document.getElementById("status");

  // ❌ VALIDATION
  if (!dog1 || !dog2) {
    status.innerText = "🚫 Please enter TWO dog names to start the race 🐕🐕";
    status.style.color = "red";
    return;
  }

  // ❌ PREVENT MULTIPLE START
  if (gameStarted) {
    status.innerText = "⚠️ Race already started!";
    status.style.color = "orange";
    return;
  }

  // ✅ START RACE
  gameStarted = true;
  status.innerText = `🏁 Race started between ${dog1} and ${dog2}!`;
  status.style.color = "lightgreen";
}
</script>

</body>
</html>
