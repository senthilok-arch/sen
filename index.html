<!DOCTYPE html>

<html>
<head>
  <title>Dog Auto Race 🐶🚕</title>
</head>

<body>
<h1>🐶 Dog Auto Race 🚕</h1>

<input id="dogName" placeholder="Dog name">
<button onclick="join()">Join</button>
<button onclick="start()">Start</button>
<button onclick="move()">Move</button>

<p id="status"></p>
<div id="track"></div>

<script>
const API = "https://senthil.onrender.com";

// Show messages on UI
function showStatus(msg) {
  document.getElementById("status").innerText = msg;
}

// Safe fetch (handles HTML / errors / JSON issues)
async function safeFetch(url, options = {}) {
  try {
    const res = await fetch(url, options);
    const text = await res.text();

    console.log("RAW RESPONSE:", text);

    try {
      return JSON.parse(text);
    } catch (e) {
      throw new Error("Response is NOT JSON → " + text);
    }
  } catch (err) {
    console.error(err);
    showStatus("❌ " + err.message);
    return null;
  }
}

async function join() {
  let name = document.getElementById("dogName").value.trim();

  if (!name) {
    showStatus("⚠️ Enter a dog name");
    return;
  }

  let data = await safeFetch(`${API}/join/${name}`, { method: "POST" });

  if (data) {
    showStatus(data.message || data.error);
    update();
  }
}

async function start() {
  let data = await safeFetch(`${API}/start`, { method: "POST" });

  if (data) {
    showStatus(data.message || data.error);
  }
}

async function move() {
  let data = await safeFetch(`${API}/move`, { method: "POST" });

  if (data) {
    if (data.winner) {
      alert("🏆 Winner: " + data.winner);
    }
    update();
  }
}

async function update() {
  let data = await safeFetch(`${API}/state`);

  if (!data) return;

  let track = document.getElementById("track");
  track.innerHTML = "";

  for (let dog in data.players) {
    let div = document.createElement("div");
    div.innerText = dog + " 🐶";
    div.style.marginLeft = (data.players[dog].position * 5) + "px";
    track.appendChild(div);
  }
}
</script>

</body>
</html>
